  <h1>fire-your-seo-agency: Claude audits your site, fixes it and measures the result</h1>
  <p class="lead">SEO and "AI visibility" agencies charge $400 to $2,500 a month, and most of what they do is public standards and repeatable checklists. This free Claude Code skill runs those checklists on your own site: it finds what's broken, fixes it with you, and books a re-measurement so you see the numbers instead of promises.</p>
  <div class="meta"><span class="pill">GitHub: leopard627/fire-your-seo-agency</span><span class="pill">MIT</span><span class="pill">Claude Code skill</span></div>

  <p>Repo: <a href="https://github.com/leopard627/fire-your-seo-agency">github.com/leopard627/fire-your-seo-agency</a></p>

  <h2><span class="n">1</span>Install it</h2>
  <p><b>The easy way:</b> open Claude Code and paste this:</p>
<pre>Install the skill from https://github.com/leopard627/fire-your-seo-agency and then audit my site.</pre>
  <p>Or install it as a plugin yourself (the README's recommended way, easy updates):</p>
<pre>/plugin marketplace add leopard627/fire-your-seo-agency
/plugin install fire-your-seo-agency@fire-your-seo-agency</pre>
  <p>Or clone it as a personal skill that works in every project:</p>
<pre>git clone https://github.com/leopard627/fire-your-seo-agency.git ~/.claude/skills/fire-your-seo-agency</pre>

  <h2><span class="n">2</span>Run the audit</h2>
  <p>In Claude Code, ideally inside your website's project folder so it can fix things directly:</p>
<pre>/fire-your-seo-agency audit my site</pre>
  <p>It reads your site the way a crawler does (no JavaScript) and returns a scorecard before it touches anything: one line per lane with a status and the evidence, for example "214 detail pages missing from sitemap" or "No llms.txt". Then it proposes priorities and asks before it starts.</p>

  <h2><span class="n">3</span>Fix, then measure</h2>
  <p>After your OK it works through the fixes: sitemap, meta tags, structured data, llms.txt, one-question-one-page landing pages. If it has access to your code it changes it; if not, it tells you file by file what to change. When it's done it records a baseline and proposes a re-measurement in 14 days (impressions, clicks, citations). "Fixed it" without a measurement doesn't count as done.</p>

  <h2>What's inside</h2>
  <div class="rules">
    <div class="rule"><b>SEO</b><span>Can Google and Bing read and index your content at all? SSR, sitemaps, meta, canonical, the classic noindex accident.</span></div>
    <div class="rule"><b>AEO</b><span>Answer engines: does the AI box above the results (Google AI Overviews, Bing Copilot) cite you? Direct-answer first paragraphs, FAQ data.</span></div>
    <div class="rule"><b>GEO + LLMO</b><span>When ChatGPT, Perplexity or Claude browse, are you the primary source? And does the model know your brand, spelled one way?</span></div>
    <div class="rule"><b>NEO (Naver)</b><span>For the Korean market: Naver Search Advisor and AI Briefing. Skip it if you don't serve Korea.</span></div>
    <div class="rule"><b>Content engine</b><span>A blog under your domain with a question backlog from your own search data and a publish gate every post must pass, plus a refresh and merge policy so posts don't rot.</span></div>
  </div>

  <h2>Honest notes</h2>
  <ul>
    <li><b>The skill is free</b> (MIT). Claude Code itself needs a Claude plan.</li>
    <li>It refuses the shady stuff on purpose: no bought backlinks, no keyword stuffing, no "guaranteed rankings".</li>
    <li>It's not magic: search results take weeks to move, which is exactly why it schedules the re-measurement.</li>
    <li>The agent reads the Korean reference docs (they're canonical); English mirrors are in <code>references/en/</code> for you.</li>
    <li>The site, search, chat and brand name in the Instagram video are illustrations drawn for the video; the numbers (614 stars, five lanes, $400 to $2,500 a month, 214 pages in the sample scorecard, 14 days) come from the repo and its README.</li>
  </ul>
